[project]
name = "comfy-studio"
version = "0.1.0"
requires-python = ">=3.12,<3.15"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn[standard]>=0.34,<1", "sqlalchemy>=2.0,<3",
  "psycopg[binary]>=3.2,<4", "pgvector>=0.3,<1", "alembic>=1.14,<2",
  "pillow>=11.1,<13", "httpx>=0.28,<1", "python-multipart>=0.0.20",
  "itsdangerous>=2.2,<3", "numpy>=2,<3", "scikit-learn>=1.6,<2",
  "websockets>=15,<17",
]

[dependency-groups]
dev = ["pytest>=8,<10", "pytest-asyncio>=0.25,<2"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
asyncio_default_fixture_loop_scope = "function"